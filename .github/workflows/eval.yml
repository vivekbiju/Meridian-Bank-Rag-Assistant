name: Meridian RAG Evaluation Gate

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  evaluate:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Start Local Backend Server
      env:
        DATABASE_URL: ${{ secrets.DATABASE_URL }}
        GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      run: |
        uvicorn main:app --host 127.0.0.1 --port 8000 &
        
        # Wait for FastAPI server to initialize cleanly
        echo "Waiting for API server to wake up..."
        sleep 10

    - name: Run Evaluation Gate Suite
      env:
        API_URL: "http://127.0.0.1:8000/chat"
        GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      run: |
        python scripts/eval.py --offline-fail-under-config thresholds.yaml