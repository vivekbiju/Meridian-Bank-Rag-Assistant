name: Meridian RAG Evaluation Gate

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  evaluate:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests pyyaml python-dotenv

    - name: Warm Up Render Service (Prevents Cold Start Drop)
      run: |
        echo "Waking up Render backend..."
        curl -s --max-time 60 https://meridian-bank-rag-assistant-1.onrender.com/docs || true
        sleep 15

    - name: Run Evaluation Gate Suite
      env:
        GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        API_URL: "https://meridian-bank-rag-assistant-1.onrender.com/chat"
      run: |
        python scripts/eval.py --offline-fail-under-config thresholds.yaml