<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meridian Bank Assistant</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 650px; margin: 40px auto; padding: 20px; }
        #chat-box { border: 1px solid #ccc; height: 350px; overflow-y: scroll; padding: 10px; margin-bottom: 10px; border-radius: 6px; }
        .user { color: #0056b3; margin: 8px 0; font-weight: bold; }
        .bot { color: #2d3748; margin: 8px 0; }
        .sources { font-size: 0.8em; color: #718096; margin-left: 10px; }
        input[type="text"] { width: 78%; padding: 10px; border-radius: 4px; border: 1px solid #ccc; }
        button { width: 18%; padding: 10px; background: #0056b3; color: white; border: none; border-radius: 4px; cursor: pointer; }
    </style>
</head>
<body>
    <h2>Meridian Bank AI Assistant</h2>
    <div id="chat-box"></div>
    <input type="text" id="user-input" placeholder="Ask a question about bank policies...">
    <button onclick="sendMessage()">Send</button>

    <script>
        const RENDER_API = "/api/chat";

        async function sendMessage() {
            const input = document.getElementById("user-input");
            const box = document.getElementById("chat-box");
            const msg = input.value.trim();
            if (!msg) return;

            box.innerHTML += `<div class="user">You: ${msg}</div>`;
            input.value = "";
            box.scrollTop = box.scrollHeight;

            try {
                const res = await fetch(RENDER_API, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ message: msg })
                });
                const data = await res.json();
                
                let sourceText = "";
                if (data.sources && data.sources.length > 0) {
                    const sections = [...new Set(data.sources.map(s => s.section))];
                    sourceText = `<div class="sources">Citations: ${sections.join(", ")}</div>`;
                }

                box.innerHTML += `<div class="bot">Assistant: ${data.reply}${sourceText}</div>`;
            } catch (err) {
                box.innerHTML += `<div class="bot" style="color:red;">Error connecting to Render backend.</div>`;
            }
            box.scrollTop = box.scrollHeight;
        }
    </script>
</body>
</html>
